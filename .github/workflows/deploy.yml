name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy manually from the Actions tab without a new push.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pushes dist/ to the gh-pages branch (creating it if needed), using
      # the repo's built-in token — no extra secrets/credentials required.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
